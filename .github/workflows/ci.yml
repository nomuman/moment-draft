name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  native-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            experiments/editor/requirements-test.txt
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python -m pip install -r requirements.txt -r experiments/editor/requirements-test.txt
      - name: Test synthetic media and service behavior
        run: python -m unittest discover -s tests -v
      - name: Test browser API errors
        run: node --test tests/test_browser_api.cjs
      - name: Build container with private-file canaries
        run: |
          touch moment_draft/private-canary.db moment_draft/private-canary.key
          touch moment_draft/static/private-canary.db moment_draft/static/private-canary.key
          mkdir -p moment_draft/static/unlisted scripts/unlisted moment_draft/unlisted.py moment_draft/static/unlisted.js
          touch moment_draft/static/unlisted/private-canary.js scripts/unlisted/private-canary.py
          touch moment_draft/unlisted.py/private-canary.key moment_draft/static/unlisted.js/private-canary.key
          docker build -t moment-draft:ci .
          docker run --rm --entrypoint python moment-draft:ci -c 'from pathlib import Path; assert not list(Path("/app").rglob("*canary*")), "Private image canary leaked"'
          docker build -t moment-context:ci -f - . <<'CONTEXT'
          FROM moment-draft:ci
          COPY . /context
          CONTEXT
          docker run --rm --entrypoint python moment-context:ci -c 'from pathlib import Path; assert not list(Path("/context").rglob("*canary*")), "Private build context canary leaked"'

      - name: Check container health and synthetic media capacity
        run: |
          set -euo pipefail
          docker volume create moment-ci-data
          trap 'docker rm -f moment-ci >/dev/null 2>&1 || true; docker volume rm moment-ci-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name moment-ci --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 -p 127.0.0.1:8770:8770 -v moment-ci-data:/data -e MOMENT_HOST=0.0.0.0 -e MOMENT_ORIGIN=http://127.0.0.1:8770 -e MOMENT_CONTAINER_LOCAL=1 moment-draft:ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8770/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs moment-ci
            exit 1
          fi
          test "$(docker inspect --format '{{.HostConfig.Memory}}' moment-ci)" = 2147483648
          python scripts/check_container_media.py
          test "$(docker inspect --format '{{.State.Running}}' moment-ci)" = true
          test "$(docker inspect --format '{{.State.OOMKilled}}' moment-ci)" = false
          docker exec -i moment-ci python - <<'PY'
          from pathlib import Path

          root = Path('/sys/fs/cgroup')
          if (root / 'memory.peak').exists():
              limit = int((root / 'memory.max').read_text())
              peak = int((root / 'memory.peak').read_text())
              events = dict(line.split() for line in (root / 'memory.events').read_text().splitlines())
              failures = int(events.get('oom', 0)) + int(events.get('oom_kill', 0))
          else:
              memory = root / 'memory'
              limit = int((memory / 'memory.limit_in_bytes').read_text())
              peak = int((memory / 'memory.max_usage_in_bytes').read_text())
              failures = int((memory / 'memory.failcnt').read_text())
          print(f'cgroup_memory_limit_bytes={limit} cgroup_memory_peak_bytes={peak} cgroup_memory_failures={failures}')
          if limit != 2147483648 or peak <= 0 or peak > limit or failures:
              raise SystemExit(1)
          PY
